{{- if include "gateway.ownSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.name" . }}
  labels: {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
  postgresUrl: {{ .Values.postgres.url | quote }}
  {{- end }}
  {{- if and .Values.sso.clientSecret (not .Values.sso.existingSecret) }}
  clientSecret: {{ .Values.sso.clientSecret | quote }}
  {{- end }}
{{- end }}
