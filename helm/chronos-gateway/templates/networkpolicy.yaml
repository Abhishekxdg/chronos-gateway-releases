{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.name" . }}
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml $np.ingressFrom | nindent 8 }}
      ports:
        - { protocol: TCP, port: 7400 }
  egress:
    # Postgres
    - to:
        {{- range $np.postgres.cidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $np.postgres.port }} }
    {{- if $np.https.cidrs }}
    # single sign-on and webhooks
    - to:
        {{- range $np.https.cidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.dns.namespace | quote }} }
          podSelector:
            matchLabels: {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
